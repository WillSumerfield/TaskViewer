[project]
name = "taskviewer-board"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["taskviewer-protocol", "PySide6-Essentials>=6.7"]

[project.scripts]
taskviewer-board = "taskviewer_board.main:main"
taskviewer-glance = "taskviewer_board.glance:main"

[tool.uv.sources]
taskviewer-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskviewer_board"]
