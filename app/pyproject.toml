[project]
name = "taskviewer-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["taskviewer-protocol", "msgspec>=0.18", "psutil>=5.9"]

[project.scripts]
taskviewer-app = "taskviewer_app.main:main"
tvc = "taskviewer_app.tvc:main"

[tool.uv.sources]
taskviewer-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskviewer_app"]
