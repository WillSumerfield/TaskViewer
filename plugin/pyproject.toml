[project]
name = "taskviewer-plugin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["taskviewer-protocol", "mcp>=2.3"]

[project.scripts]
taskviewer-mcp = "taskviewer_plugin.mcp_server:main"
taskviewer-hook = "taskviewer_plugin.hook:main"

[tool.uv.sources]
taskviewer-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskviewer_plugin"]
